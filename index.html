<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberChef | Entering the Kitchen...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Roboto+Mono:wght@700&display=swap');

        body, html { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:'Roboto Mono', monospace; color:#0ff; cursor:none; }
        #tsparticles { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; display:flex; flex-direction:column; justify-content:center; align-items:center; pointer-events:none; text-align:center; }
        .overlay > * { pointer-events:auto; }
        h1 { font-family:'Orbitron', sans-serif; font-size:clamp(3rem, 10vw, 8rem); margin:0; text-shadow:0 0 20px #0ff, 0 0 40px #0ff; position:relative; }
        h1::before, h1::after { content:attr(data-text); position:absolute; top:0; left:0; width:100%; height:100%; }
        h1::before { animation:glitch1 3s infinite; color:#f0f; clip-path:polygon(0 0, 100% 0, 100% 45%, 0 45%); }
        h1::after { animation:glitch2 3s infinite; color:#ff0; clip-path:polygon(0 80%, 100% 80%, 100% 100%, 0 100%); }
        @keyframes glitch1 { 0%,100%{transform:translate(0);} 20%{transform:translate(-5px,5px);} 40%{transform:translate(-5px,-5px);} 60%{transform:translate(5px,5px);} 80%{transform:translate(5px,-5px);} }
        @keyframes glitch2 { 0%,100%{transform:translate(0);} 20%{transform:translate(5px,-5px);} 40%{transform:translate(5px,5px);} 60%{transform:translate(-5px,-5px);} 80%{transform:translate(-5px,5px);} }
        .subtitle { font-size:clamp(1rem, 3vw, 2rem); opacity:0.9; margin:20px 0; letter-spacing:2px; }
        .countdown-svg { width:250px; height:250px; margin:30px 0; filter:drop-shadow(0 0 30px #0ff); }
        .countdown-svg circle { fill:none; stroke:#0ff; stroke-width:12; stroke-linecap:round; }
        .progress { stroke-dasharray:534; stroke-dashoffset:534; animation:fillup 15s linear forwards; stroke:url(#gradient); }
        .countdown-svg text { font-size:80px; fill:#fff; text-anchor:middle; dominant-baseline:central; font-weight:bold; text-shadow:0 0 20px #0ff; }
        @keyframes fillup { to { stroke-dashoffset:0; } }
        .links { margin-top:40px; display:flex; flex-direction:column; gap:30px; }
        .links a { font-size:clamp(1.2rem, 4vw, 2.5rem); text-decoration:none; color:#0ff; text-shadow:0 0 15px #0ff; padding:15px 40px; border:2px solid #0ff; border-radius:50px; transition:0.4s; position:relative; overflow:hidden; background:transparent; }
        .links a:hover { background:#0ff; color:#000; box-shadow:0 0 50px #0ff; transform:scale(1.1); }
        .links a::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0; background:rgba(0,255,255,0.3); border-radius:50%; transition:0.6s; transform:translate(-50%,-50%); }
        .links a:hover::before { width:300px; height:300px; }
        .trail { position:fixed; pointer-events:none; width:12px; height:12px; background:#0ff; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 15px #0ff; animation:trailfade 1s forwards; z-index:3; }
        @keyframes trailfade { to { opacity:0; transform:translate(-50%,-50%) scale(4); } }
        .ripple { position:fixed; pointer-events:none; border:3px solid #0ff; border-radius:50%; transform:translate(-50%,-50%) scale(0); animation:rippleanim 1.5s forwards; box-shadow:0 0 30px #0ff; z-index:3; }
        @keyframes rippleanim { to { transform:translate(-50%,-50%) scale(25); opacity:0; } }
        .info { position:absolute; bottom:20px; font-size:0.8rem; opacity:0.5; }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <div class="overlay">
        <h1 data-text="CyberChef" class="glitch">CyberChef</h1>
        <p class="subtitle">The Cyber Swiss Army Knife</p>
        
        <svg class="countdown-svg" viewBox="0 0 200 200">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0ff"/>
                    <stop offset="100%" stop-color="#f0f"/>
                </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="85" stroke="#222" stroke-width="14"/>
            <circle class="progress" cx="100" cy="100" r="85"/>
            <text id="count" x="100" y="105">15</text>
        </svg>
        
        <p style="font-size:1.2rem; opacity:0.8;">Cooking cyber magic... auto-redirect in <span id="count2">15</span>s</p>
        
        <div class="links">
            <a href="/CyberChef" id="onlineLink">Enter Online Kitchen →</a>
            <a href="https://raw.githubusercontent.com/camAtGitHub/camAtGitHub.github.io/refs/heads/github-pages/CyberChef_v10.19.5-2a1294f.zip" download="CyberChef_Offline.zip">Download Offline Bundle (ZIP)</a>
        </div>
        
        <p class="info">Pro tip: Move your mouse. Click everywhere. Thank me later.</p>
    </div>

    <!-- tsParticles + Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/engine@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/shape-text@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/interaction-external-repulse@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/interaction-external-push@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/plugin-links@3.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.5.0"></script>

    <script>
        const ops = ["Base64","Hex","ROT13","XOR","AES","RSA","SHA256","MD5","GZIP","JWT","JSON","Morse","Vigenère","Enigma","Fork","Merge","Magic","Entropy","YARA","Deflate","BZIP2","RC4","HMAC","Bacon","URL Encode","HTML","Sniff","Parse UA","From Binary","To Charcode","Drop","Regular Expression"];

        let redirectTimeout = setTimeout(() => { window.location.href = "/CyberChef"; }, 15000);
        document.getElementById('onlineLink').addEventListener('click', () => clearTimeout(redirectTimeout));

        let remaining = 15;
        const interval = setInterval(() => {
            remaining--;
            document.getElementById('count').textContent = Math.max(0, remaining);
            document.getElementById('count2').textContent = Math.max(0, remaining);
            if (remaining <= 0) clearInterval(interval);
        }, 1000);

        // Particle madness
        tsParticles.load("tsparticles", {
            background: { color: "#000" },
            fullScreen: { enable: true, zIndex: -1 },
            particles: {
                number: { value: 100, density: { enable: true } },
                color: { value: ["#00ffff", "#ff00ff", "#ffff00"] },
                shape: { type: "char", options: { char: { value: ops, font: "monospace", style: "normal", weight: "bold" } } },
                opacity: { value: { min: 0.3, max: 0.9 } },
                size: { value: { min: 12, max: 28 } },
                links: { enable: true, distance: 180, color: "#0ff", opacity: 0.4, width: 1.5 },
                move: { enable: true, speed: 1.5, direction: "none", outModes: "bounce" }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "repulse" },
                    onClick: { enable: true, mode: "push" }
                },
                modes: {
                    repulse: { distance: 250, duration: 0.8, speed: 1 },
                    push: { quantity: 8 }
                }
            },
            detectRetina: true
        });

        // Cursor trails
        document.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            trail.classList.add('trail');
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 1000);
        });

        // Ripples on click
        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '50px';
            ripple.style.height = '50px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 2000);
        });

        // Easter egg confetti (click title 6 times)
        let egg = 0;
        document.querySelector('h1').addEventListener('click', () => {
            egg++;
            if (egg >= 6) {
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#0ff','#f0f','#ff0'] });
                egg = 0;
            }
        });
    </script>
</body>
</html>
